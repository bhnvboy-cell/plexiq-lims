version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plexiq-lims
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: limsdb
      DB_USERNAME: lims_user
      DB_PASSWORD: "${DB_PASSWORD:-changeme_secure_password}"
      SESSION_DRIVER: file
      COA_STORAGE_PATH: storage/coa
      COMPANY_NAME: "${COMPANY_NAME:-Your Laboratory Name}"
      SAP_HANA_SYNC_ENABLED: "${SAP_HANA_SYNC_ENABLED:-false}"
    volumes:
      - coa_storage:/var/www/html/storage/coa
      - logs_storage:/var/www/html/storage/logs
      - sessions_storage:/var/www/html/storage/sessions
      - ./docker/php.ini:/usr/local/etc/php/conf.d/lims.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lims-network

  db:
    image: postgres:16-alpine
    container_name: plexiq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: limsdb
      POSTGRES_USER: lims_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_secure_password}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims_user -d limsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lims-network

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: plexiq-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - lims-network
    profiles:
      - dev
      - tools

volumes:
  postgres_data:
    driver: local
  coa_storage:
    driver: local
  logs_storage:
    driver: local
  sessions_storage:
    driver: local

networks:
  lims-network:
    driver: bridge
