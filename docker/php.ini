[PHP]
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
session.save_path = /var/www/html/storage/sessions

[APCu]
apc.enable_cli = 1
