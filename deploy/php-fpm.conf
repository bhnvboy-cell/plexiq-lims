; PlexiQ LIMS - PHP-FPM production pool config
; Place in /etc/php-fpm.d/plexiq.conf (or /etc/php/8.x/fpm/pool.d/ on Debian).

[plexiq]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Simple static pool sizing for a low-traffic LIMS instance.
pm = static
pm.max_children = 8

; Backlog of pending connections.
pm.max_requests = 500

; Per-request limits.
request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm/plexiq-slow.log

; Hardening.
php_admin_flag[expose_php] = Off
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_value[date.timezone] = UTC

; FPM status page (optional, for monitoring).
pm.status_path = /status
