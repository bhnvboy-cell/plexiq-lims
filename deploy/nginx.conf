# PlexiQ LIMS - Nginx production config
# Place in /etc/nginx/sites-available/plexiq and symlink into sites-enabled.
# The PHP app lives under public/; front controller is public/index.php.

server {
    listen 80;
    server_name lims.example.com;

    root /var/www/plexiq/public;
    index index.php;

    charset utf-8;

    access_log /var/log/nginx/plexiq.access.log;
    error_log  /var/log/nginx/plexiq.error.log;

    # Static assets: let nginx serve them directly, never pass to PHP.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        try_files $uri =404;
        expires 7d;
    }

    # Never expose application internals.
    location ~ ^/(app|config|database|resources|storage|bin|\.env) {
        deny all;
        return 404;
    }

    # Front controller routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SERVER_NAME $host;
        fastcgi_read_timeout 300;
    }

    # Uploads (if ever served from a public dir).
    location /uploads/ {
        try_files $uri =404;
    }

    # Deny hidden files (.htaccess, .env, etc).
    location ~ /\. {
        deny all;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
