openapi: 3.0.3
info:
  title: PlexiQ LIMS REST API
  description: Regulated Laboratory Information Management System API (21 CFR Part 11 & GAMP 5 compliant).
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      summary: Service Health Check
      responses:
        '200':
          description: Service health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/health:
    get:
      summary: API Health Check
      responses:
        '200':
          description: API health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/samples:
    get:
      summary: List registered laboratory samples
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Array of samples
        '401':
          description: Unauthorized
        '403':
          description: Lacks samples.read scope
    post:
      summary: Register a new sample
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, product_id, batch_number]
              properties:
                sample_code:
                  type: string
                customer_id:
                  type: integer
                product_id:
                  type: integer
                batch_number:
                  type: string
                priority:
                  type: string
                  enum: [Normal, Urgent, Rush]
      responses:
        '201':
          description: Sample created
        '400':
          description: Validation error
  /api/samples/{id}:
    get:
      summary: Retrieve a single sample with tests and results
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sample details
        '404':
          description: Not found
    put:
      summary: Update sample metadata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Sample updated
  /api/samples/{id}/tests:
    get:
      summary: List test assignments for a sample
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of assigned tests
  /api/results:
    get:
      summary: List test results
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of analytical results
  /api/results/{sampleTestId}:
    post:
      summary: Submit analytical test result
      security:
        - BearerAuth: []
      parameters:
        - name: sampleTestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result_value:
                  type: number
                result_text:
                  type: string
                remarks:
                  type: string
                reason_for_change:
                  type: string
      responses:
        '200':
          description: Result recorded
  /api/coa/{sampleId}:
    get:
      summary: Generate or retrieve released Certificate of Analysis
      security:
        - BearerAuth: []
      parameters:
        - name: sampleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: COA document metadata and release signatures
  /api/scim/v2/Users:
    get:
      summary: SCIM 2.0 List Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: SCIM ListResponse
    post:
      summary: SCIM 2.0 Provision User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, emails]
      responses:
        '201':
          description: SCIM User Created
  /api/scim/v2/Users/{id}:
    get:
      summary: SCIM 2.0 Get User
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: SCIM User Resource
    delete:
      summary: SCIM 2.0 Deactivate User
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deactivated
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time
        app:
          type: string
        version:
          type: string
