openapi: 3.0.3
info:
  title: PlexiQ LIMS REST API
  description: Regulated Laboratory Information Management System API (21 CFR Part 11 & GAMP 5 compliant).
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      summary: Service Health Check
      responses:
        '200':
          description: Service health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/health:
    get:
      summary: API Health Check
      responses:
        '200':
          description: API health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/samples:
    get:
      summary: List registered laboratory samples
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Array of samples
        '401':
          description: Unauthorized
        '403':
          description: Lacks samples.read scope
    post:
      summary: Register a new sample
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, product_id, batch_number]
              properties:
                sample_code:
                  type: string
                customer_id:
                  type: integer
                product_id:
                  type: integer
                batch_number:
                  type: string
                priority:
                  type: string
                  enum: [Normal, Urgent, Rush]
      responses:
        '201':
          description: Sample created
        '400':
          description: Validation error
  /api/samples/{id}:
    get:
      summary: Retrieve a single sample with tests and results
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sample details
        '404':
          description: Not found
    put:
      summary: Update sample metadata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Sample updated
  /api/samples/{id}/tests:
    get:
      summary: List test assignments for a sample
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of assigned tests
  /api/samples/{id}/aliquot:
    post:
      summary: Generate child aliquots from a parent sample
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  example: 3
                volume:
                  type: string
                  example: "5 mL"
      responses:
        '200':
          description: Created aliquots
  /api/samples/composite:
    post:
      summary: Combine multiple source samples into a composite sample
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_ids:
                  type: array
                  items:
                    type: integer
                composite_code:
                  type: string
      responses:
        '200':
          description: Created composite sample
  /api/samples/{id}/genealogy:
    get:
      summary: Retrieve genealogical lineage tree for a sample
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Genealogical lineage tree
  /api/storage/box/{id}:
    get:
      summary: Retrieve 2D storage box well coordinate matrix
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Box layout and occupied slot details
  /api/storage/check-in:
    post:
      summary: Check in sample to a 2D coordinate slot
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sample_id:
                  type: integer
                storage_location_id:
                  type: integer
                row:
                  type: integer
                col:
                  type: integer
      responses:
        '200':
          description: Sample assigned to coordinate slot
  /api/storage/check-out:
    post:
      summary: Check out sample from storage with required reason
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sample_id:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Sample checked out
  /api/formulas/evaluate:
    post:
      summary: Sandbox evaluate a mathematical formula with variables and ASTM E29 sig-figs
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                variables:
                  type: object
                sig_figs:
                  type: integer
      responses:
        '200':
          description: Calculation result
  /api/labels/sample/{id}:
    get:
      summary: Render industrial print stream (ZPL/TSPL/SVG) for sample label
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rendered label payload
  /api/uncertainty/calculate:
    post:
      summary: Calculate ISO 17025 combined and expanded measurement uncertainty
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                k_factor:
                  type: number
                  example: 2.0
                components:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Combined and expanded uncertainty
  /api/stability/regression/evaluate:
    post:
      summary: Perform ICH Q1E linear regression and predict shelf-life against specification limits
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lower_spec_limit:
                  type: number
                upper_spec_limit:
                  type: number
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      month:
                        type: number
                      value:
                        type: number
      responses:
        '200':
          description: Regression parameters, 95% confidence intervals, and predicted shelf-life
  /api/results:
    get:
      summary: List test results
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of analytical results
  /api/results/{sampleTestId}:
    post:
      summary: Submit analytical test result
      security:
        - BearerAuth: []
      parameters:
        - name: sampleTestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result_value:
                  type: number
                result_text:
                  type: string
                remarks:
                  type: string
                reason_for_change:
                  type: string
      responses:
        '200':
          description: Result recorded
  /api/coa/{sampleId}:
    get:
      summary: Generate or retrieve released Certificate of Analysis
      security:
        - BearerAuth: []
      parameters:
        - name: sampleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: COA document metadata and release signatures
  /api/scim/v2/Users:
    get:
      summary: SCIM 2.0 List Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: SCIM ListResponse
    post:
      summary: SCIM 2.0 Provision User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, emails]
      responses:
        '201':
          description: SCIM User Created
  /api/scim/v2/Users/{id}:
    get:
      summary: SCIM 2.0 Get User
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: SCIM User Resource
    delete:
      summary: SCIM 2.0 Deactivate User
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deactivated
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time
        app:
          type: string
        version:
          type: string
