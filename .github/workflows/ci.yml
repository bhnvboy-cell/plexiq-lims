name: PlexiQ LIMS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: limsdb
      DB_USERNAME: lims_user
      DB_PASSWORD: lims_password
      APP_ENV: testing

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: limsdb
          POSTGRES_USER: lims_user
          POSTGRES_PASSWORD: lims_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_pgsql, pgsql, mbstring, curl, json, fileinfo, xml
          coverage: none

      - name: Configure environment files
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=limsdb/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=lims_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=lims_password/' .env
          if [ -f .env.testing ]; then
            sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
            sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
            sed -i 's/DB_DATABASE=.*/DB_DATABASE=limsdb/' .env.testing
            sed -i 's/DB_USERNAME=.*/DB_USERNAME=lims_user/' .env.testing
            sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=lims_password/' .env.testing
          fi

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate App Key
        run: php bin/console key:generate

      - name: Run Database Migrations
        run: php bin/console migrate

      - name: Run Unit Tests
        run: php phpunit.phar --testsuite Unit

      - name: Verify Audit Trail Integrity
        run: php bin/console audit:verify
