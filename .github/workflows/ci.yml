name: PlexiQ LIMS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: limsdb
          POSTGRES_USER: lims_user
          POSTGRES_PASSWORD: lims_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_pgsql, pgsql, mbstring, curl, json, fileinfo, xml
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate App Key
        run: php bin/console key:generate

      - name: Run Database Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: limsdb
          DB_USERNAME: lims_user
          DB_PASSWORD: lims_password
        run: php bin/console migrate

      - name: Run Unit Tests
        run: php phpunit.phar --testsuite Unit

      - name: Verify Audit Trail Integrity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: limsdb
          DB_USERNAME: lims_user
          DB_PASSWORD: lims_password
        run: php bin/console audit:verify
